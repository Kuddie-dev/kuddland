<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kuddland Public</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #eee; }
    header, main, section { padding: 16px; }
    .card { background: #1b1b1b; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    input, select, button, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0; border-radius: 10px; border: 1px solid #333; background: #222; color: #eee; }
    button { cursor: pointer; }
    .hidden { display: none; }
    img { max-width: 100%; border-radius: 12px; }
    .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    .chips button { width: auto; margin-right: 6px; display: inline-block; }
  </style>
</head>
<body>
  <main id="authView">
    <h1>Kuddland</h1>

    <section class="card">
      <h2>Register</h2>
      <form id="registerForm">
        <input id="regUsername" placeholder="Username" />
        <input id="regEmail" type="email" placeholder="Email" />
        <input id="regPassword" type="password" placeholder="Password" />
        <button type="submit">Create account</button>
      </form>
    </section>

    <section class="card">
      <h2>Login</h2>
      <form id="loginForm">
        <input id="logEmail" type="email" placeholder="Email" />
        <input id="logPassword" type="password" placeholder="Password" />
        <button type="submit">Login</button>
      </form>
    </section>
  </main>

  <main id="appView" class="hidden">
    <header class="card">
      <h1>Kuddland Public</h1>
      <div id="meBox"></div>
      <button id="logoutBtn">Logout</button>
    </header>

    <section class="card">
      <h2>Profile</h2>
      <input id="bioInput" placeholder="Bio" />
      <div class="row">
        <input id="avatarFile" type="file" accept="image/*" />
        <input id="bannerFile" type="file" accept="image/*" />
      </div>
      <button id="saveProfileBtn">Save Profile</button>
      <div id="profilePreview"></div>
    </section>

    <section class="card">
      <h2>Boards</h2>
      <div id="boardButtons" class="chips"></div>
      <select id="boardSelect"></select>
    </section>

    <section class="card">
      <h2>Create Post</h2>
      <input id="titleInput" placeholder="Post title" />
      <input id="tagsInput" placeholder="Tags, comma, separated" />
      <input id="imageInput" type="file" accept="image/*" />
      <button id="postBtn">Post</button>
    </section>

    <section class="card">
      <h2>Feed</h2>
      <div id="feed"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
